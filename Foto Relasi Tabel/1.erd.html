<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERD Olbeemi - Word Compact</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9e9e9;color:#000;font-family:Arial,Helvetica,sans-serif}
header{
  background:#fff;border-bottom:1px solid #aaa;padding:12px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap
}
header strong{font-size:18px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{
  border:1px solid #000;background:#fff;color:#000;padding:8px 11px;
  font:14px Arial;cursor:pointer
}
.help{margin:0;background:#fff;padding:8px 18px;font-size:13px;border-bottom:1px solid #ccc}
.viewport{overflow:auto;padding:16px}
svg{
  display:block;background:#fff;margin:auto;box-shadow:0 2px 10px #0002;
  width:min(98vw,1500px);height:auto;
  text-rendering:geometricPrecision;shape-rendering:geometricPrecision
}
@media print{
  @page{size:A3 landscape;margin:6mm}
  header,.help{display:none}
  body{background:#fff}
  .viewport{padding:0;overflow:visible}
  svg{width:100%!important;box-shadow:none}
}
</style>
</head>
<body>
<header>
  <strong>ERD Database olbeemi_pos — versi padat untuk Word</strong>
  <div class="controls">
    <button id="exportSvg">Export SVG untuk Word</button>
    <button id="exportPng">Export PNG 3x</button>
    <span id="status"></span>
  </div>
</header>
<p class="help">Gunakan SVG untuk Word agar teks tetap tajam. Layout dibuat padat 4×4 agar tidak mengecil saat dimasukkan ke halaman landscape.</p>

<main class="viewport">
<svg id="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3200 2100" role="img" aria-label="ERD database olbeemi_pos">
<style>
.title{font:bold 42px Arial;fill:#000;text-anchor:middle}
.subtitle{font:24px Arial;fill:#000;text-anchor:middle}

.card{fill:#fff;stroke:#000;stroke-width:2.4}
.head{fill:#efefef;stroke:#000;stroke-width:2.4}
.table-title{font:bold 27px Arial;fill:#000;text-anchor:middle}
.colhead{font:bold 18px Arial;fill:#000}
.field{font:22px Arial;fill:#000}
.key{font:bold 17px Arial;fill:#000}
.type{font:18px Arial;fill:#222}
.rule{stroke:#b8b8b8;stroke-width:1}

.relation{fill:none;stroke:#000;stroke-width:2.2;stroke-linejoin:round}
.logical .relation{stroke-dasharray:8 5}
.halo{fill:none;stroke:#fff;stroke-width:8;stroke-linejoin:round}
.number{font:bold 20px Arial;fill:#000;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.legend{font:19px Arial;fill:#000}
</style>

<rect width="3200" height="2100" fill="#fff"/>
<text x="1600" y="58" class="title">ENTITY RELATIONSHIP DIAGRAM</text>
<text x="1600" y="94" class="subtitle">Database olbeemi_pos • Relasi tabel dan kolom inti</text>

<g id="links"></g>
<g id="tables"></g>

<g transform="translate(90 2000)">
  <text class="legend" y="0">PK = Primary Key • UK = Unique Key • FK = Foreign Key • REF = referensi logis aplikasi</text>
  <path d="M0 34 H90" class="relation"/><text class="legend" x="105" y="40">FK</text>
  <path d="M260 34 H350" class="relation" stroke-dasharray="8 5"/><text class="legend" x="365" y="40">REF aplikasi</text>
  <text class="legend" x="690" y="40">1 / N = kardinalitas maksimum</text>
  <text class="legend" y="82">Kolom noninti tidak seluruhnya ditampilkan agar diagram tetap terbaca di Word.</text>
</g>
</svg>
</main>

<script>
'use strict';

const NS='http://www.w3.org/2000/svg';
const W=560, ROW=34, TOP=76;

// Layout padat 4 kolom × 4 baris.
// Setiap tabel ditempatkan berdekatan dengan tabel yang paling sering berelasi.
const data={
  users:{p:[80,150],f:[
    ['id','int(11)','PK'],['name','varchar(100)','UK'],['password_hash','varchar(255)'],
    ['role','varchar(20)'],['created_at','timestamp']
  ]},
  permintaan_menu:{p:[840,150],f:[
    ['id','int(11)','PK'],['user_id','int(11)','REF'],['reviewed_by','int(11)','REF'],
    ['menu_id','int(11)','REF'],['jenis','varchar(30)'],['status','varchar(20)'],['data_json','text']
  ]},
  menu:{p:[1600,150],f:[
    ['id','int(11)','PK'],['nama_menu','varchar(150)'],['kategori','enum'],
    ['harga_jual','decimal(12,2)'],['keuntungan','decimal(12,2)'],['status','enum']
  ]},
  menu_resep:{p:[2360,150],f:[
    ['id','int(11)','PK'],['menu_id','int(11)','FK'],['bahan_id','int(11)','FK'],['jumlah','decimal(12,2)']
  ]},

  pesanan:{p:[80,600],f:[
    ['id','int(11)','PK'],['transaksi_id','int(11)','REF'],['kode_pesanan','varchar(30)','UK'],
    ['nama_pelanggan','varchar(120)'],['metode_pembayaran','enum'],['status','enum'],['subtotal','decimal(12,2)']
  ]},
  pesanan_detail:{p:[840,600],f:[
    ['id','int(11)','PK'],['pesanan_id','int(11)','FK'],['menu_id','int(11)','REF'],
    ['nama_menu','varchar(160)'],['qty','int(11)'],['harga_satuan','decimal(12,2)'],['subtotal','decimal(12,2)']
  ]},
  transaksi_detail:{p:[1600,600],f:[
    ['id','int(11)','PK'],['transaksi_id','int(11)','FK'],['menu_id','int(11)','FK'],
    ['nama_menu','varchar(150)'],['qty','int(11)'],['harga_satuan','decimal(12,2)'],['subtotal','decimal(12,2)']
  ]},
  transaksi:{p:[2360,600],f:[
    ['id','int(11)','PK'],['kode_transaksi','varchar(50)','UK'],['metode_pembayaran','enum'],
    ['subtotal','decimal(12,2)'],['bayar','decimal(12,2)'],['kembalian','decimal(12,2)'],['total_profit','decimal(12,2)']
  ]},

  supplier:{p:[80,1050],f:[
    ['id','int(11)','PK'],['nama_supplier','varchar(120)','UK'],['no_telepon','varchar(30)'],['alamat','text']
  ]},
  supplier_bahan:{p:[840,1050],f:[
    ['id','int(11)','PK'],['supplier_id','int(11)','REF'],['bahan_id','int(11)','REF'],['harga','decimal(12,2)']
  ]},
  bahan_baku:{p:[1600,1050],f:[
    ['id','int(11)','PK'],['nama_bahan','varchar(100)','UK'],['stok','decimal(10,2)'],
    ['satuan','varchar(20)'],['minimum_stok','decimal(10,2)']
  ]},
  riwayat_keluar:{p:[2360,1050],f:[
    ['id','int(11)','PK'],['bahan_id','int(11)','FK'],['nama_bahan','varchar(150)'],
    ['jumlah_keluar','decimal(12,2)'],['total_setelah','decimal(12,2)'],['tanggal','timestamp']
  ]},

  permintaan_stok:{p:[80,1500],f:[
    ['id','int(11)','PK'],['user_id','int(11)','REF'],['reviewed_by','int(11)','REF'],
    ['bahan_id','int(11)','REF'],['supplier_id','int(11)','REF'],['pesanan_supplier_id','int(11)','REF'],
    ['jenis','varchar(20)'],['jumlah','decimal(12,2)'],['status','varchar(20)']
  ]},
  pesanan_supplier:{p:[840,1500],f:[
    ['id','int(11)','PK'],['permintaan_stok_id','int(11)','REF'],['bahan_id','int(11)','REF'],
    ['supplier_id','int(11)','REF'],['jumlah','decimal(12,2)'],['total_pembelian','decimal(14,2)'],
    ['status','varchar(30)'],['tanggal_pesan','datetime']
  ]},
  riwayat_masuk:{p:[1600,1500],f:[
    ['id','int(11)','PK'],['bahan_id','int(11)','FK'],['supplier_id','int(11)','REF'],
    ['jumlah_masuk','decimal(10,2)'],['total_setelah','decimal(10,2)'],['tanggal','datetime']
  ]},
  pengeluaran:{p:[2360,1500],f:[
    ['id','int(11)','PK'],['riwayat_masuk_id','int(11)','REF/UK'],['bahan_id','int(11)','REF'],
    ['supplier_id','int(11)','REF'],['nominal','decimal(14,2)'],['tanggal','datetime']
  ]}
};

function el(tag,attrs,text){
  const n=document.createElementNS(NS,tag);
  Object.entries(attrs||{}).forEach(([k,v])=>n.setAttribute(k,v));
  if(text!==undefined)n.textContent=text;
  return n;
}

function tableHeight(t){ return TOP + t.f.length*ROW; }
function rowCenter(t, field){
  const i=t.f.findIndex(f=>f[0]===field);
  return t.p[1] + TOP + i*ROW + ROW/2;
}
function anchor(name,field,side){
  const t=data[name], x=t.p[0], y=rowCenter(t,field);
  if(side==='L') return [x,y];
  if(side==='R') return [x+W,y];
  if(side==='T') return [x+W/2,t.p[1]];
  return [x+W/2,t.p[1]+tableHeight(t)];
}

// Relations: [child, field, parent, childSide, parentSide, physical, lane]
const rels=[
  ['permintaan_menu','user_id','users','L','R',false,0],
  ['permintaan_menu','reviewed_by','users','L','R',false,1],
  ['permintaan_menu','menu_id','menu','R','L',false,0],

  ['menu_resep','menu_id','menu','L','R',true,0],
  ['menu_resep','bahan_id','bahan_baku','B','T',true,0],

  ['pesanan_detail','pesanan_id','pesanan','L','R',true,0],
  ['pesanan_detail','menu_id','menu','T','B',false,0],

  ['transaksi_detail','transaksi_id','transaksi','R','L',true,0],
  ['transaksi_detail','menu_id','menu','T','B',true,1],
  ['pesanan','transaksi_id','transaksi','B','B',false,0],

  ['supplier_bahan','supplier_id','supplier','L','R',false,0],
  ['supplier_bahan','bahan_id','bahan_baku','R','L',false,0],

  ['riwayat_keluar','bahan_id','bahan_baku','L','R',true,0],

  ['permintaan_stok','user_id','users','L','L',false,0],
  ['permintaan_stok','reviewed_by','users','L','L',false,1],
  ['permintaan_stok','bahan_id','bahan_baku','T','B',false,0],
  ['permintaan_stok','supplier_id','supplier','T','B',false,1],
  ['permintaan_stok','pesanan_supplier_id','pesanan_supplier','R','L',false,0],

  ['pesanan_supplier','permintaan_stok_id','permintaan_stok','L','R',false,1],
  ['pesanan_supplier','bahan_id','bahan_baku','T','B',false,1],
  ['pesanan_supplier','supplier_id','supplier','T','B',false,2],

  ['riwayat_masuk','bahan_id','bahan_baku','T','B',true,2],
  ['riwayat_masuk','supplier_id','supplier','T','B',false,3],

  ['pengeluaran','riwayat_masuk_id','riwayat_masuk','L','R',false,0],
  ['pengeluaran','bahan_id','bahan_baku','T','B',false,3],
  ['pengeluaran','supplier_id','supplier','T','B',false,4]
];

function orthogonalPath(a,b,sideA,sideB,lane){
  const offset=26 + lane*18;

  // horizontal-facing pair
  if((sideA==='L'||sideA==='R') && (sideB==='L'||sideB==='R')){
    const dirA=sideA==='R'?1:-1;
    const dirB=sideB==='R'?1:-1;
    const x1=a[0]+dirA*offset;
    const x2=b[0]+dirB*offset;
    const mid=(x1+x2)/2;
    return `M${a[0]} ${a[1]} L${x1} ${a[1]} L${mid} ${a[1]} L${mid} ${b[1]} L${x2} ${b[1]} L${b[0]} ${b[1]}`;
  }

  // vertical-facing pair
  if((sideA==='T'||sideA==='B') && (sideB==='T'||sideB==='B')){
    const dirA=sideA==='B'?1:-1;
    const dirB=sideB==='B'?1:-1;
    const y1=a[1]+dirA*offset;
    const y2=b[1]+dirB*offset;
    const mid=(y1+y2)/2;
    return `M${a[0]} ${a[1]} L${a[0]} ${y1} L${a[0]} ${mid} L${b[0]} ${mid} L${b[0]} ${y2} L${b[0]} ${b[1]}`;
  }

  // mixed
  const dirA=(sideA==='R'?1:sideA==='L'?-1:0);
  const dirAy=(sideA==='B'?1:sideA==='T'?-1:0);
  const p1=[a[0]+dirA*offset,a[1]+dirAy*offset];
  const dirB=(sideB==='R'?1:sideB==='L'?-1:0);
  const dirBy=(sideB==='B'?1:sideB==='T'?-1:0);
  const p2=[b[0]+dirB*offset,b[1]+dirBy*offset];

  if(sideA==='L'||sideA==='R'){
    return `M${a[0]} ${a[1]} L${p1[0]} ${p1[1]} L${p1[0]} ${p2[1]} L${p2[0]} ${p2[1]} L${b[0]} ${b[1]}`;
  }else{
    return `M${a[0]} ${a[1]} L${p1[0]} ${p1[1]} L${p2[0]} ${p1[1]} L${p2[0]} ${p2[1]} L${b[0]} ${b[1]}`;
  }
}

const links=document.getElementById('links');

rels.forEach(([child,field,parent,cs,ps,physical,lane])=>{
  const a=anchor(child,field,cs), b=anchor(parent,'id',ps);
  const d=orthogonalPath(a,b,cs,ps,lane);

  const g=el('g',{class:physical?'physical':'logical'});
  g.append(el('title',{},`${child}.${field} → ${parent}.id`));
  g.append(el('path',{d,class:'halo'}));
  g.append(el('path',{d,class:'relation'}));

  // cardinality labels
  const childOne = child==='pengeluaran' && field==='riwayat_masuk_id';
  const childLabel=childOne?'1':'N';

  const offsetText=(side,pt,label)=>{
    let x=pt[0],y=pt[1]-9;
    if(side==='L')x-=28;
    if(side==='R')x+=14;
    if(side==='T'){x+=12;y-=10;}
    if(side==='B'){x+=12;y+=26;}
    g.append(el('text',{x,y,class:'number'},label));
  };
  offsetText(cs,a,childLabel);
  offsetText(ps,b,'1');

  links.append(g);
});

const tables=document.getElementById('tables');

Object.entries(data).forEach(([name,t])=>{
  const [x,y]=t.p, h=tableHeight(t);
  const g=el('g',{});

  g.append(el('rect',{x,y,width:W,height:h,class:'card'}));
  g.append(el('rect',{x,y,width:W,height:44,class:'head'}));
  g.append(el('text',{x:x+W/2,y:y+29,class:'table-title'},name));

  g.append(el('text',{x:x+14,y:y+66,class:'colhead'},'Kunci'));
  g.append(el('text',{x:x+92,y:y+66,class:'colhead'},'Kolom'));
  g.append(el('text',{x:x+385,y:y+66,class:'colhead'},'Tipe'));

  t.f.forEach(([field,type,key],i)=>{
    const yy=y+TOP+i*ROW;
    const baseline=yy+ROW/2+7;
    g.append(el('line',{x1:x,y1:yy,x2:x+W,y2:yy,class:'rule'}));
    g.append(el('text',{x:x+14,y:baseline,class:'key'},key||''));
    g.append(el('text',{x:x+92,y:baseline,class:'field'},field));
    g.append(el('text',{x:x+385,y:baseline,class:'type'},type));
  });

  tables.append(g);
});

const svg=document.getElementById('diagram');

function serialize(){
  const copy=svg.cloneNode(true);
  copy.removeAttribute('style');
  copy.setAttribute('width','3200');
  copy.setAttribute('height','2100');
  copy.setAttribute('xmlns','http://www.w3.org/2000/svg');
  return new XMLSerializer().serializeToString(copy);
}

document.getElementById('exportSvg').addEventListener('click',()=>{
  const status=document.getElementById('status');
  try{
    const blob=new Blob([serialize()],{type:'image/svg+xml;charset=utf-8'});
    const href=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=href;
    a.download='ERD_Olbeemi_Word_Compact.svg';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(href),30000);
    status.textContent='SVG siap.';
  }catch(e){
    status.textContent='Export SVG gagal.';
  }
});

document.getElementById('exportPng').addEventListener('click',async()=>{
  const status=document.getElementById('status');
  status.textContent='Menyiapkan PNG…';
  let url;
  try{
    url=URL.createObjectURL(new Blob([serialize()],{type:'image/svg+xml'}));
    const img=new Image();
    await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});
    const c=document.createElement('canvas');
    c.width=9600;c.height=6300;
    const ctx=c.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
    ctx.drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(ok=>c.toBlob(ok,'image/png',1));
    const href=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=href;a.download='ERD_Olbeemi_Word_Compact_3x.png';a.click();
    setTimeout(()=>URL.revokeObjectURL(href),30000);
    status.textContent='PNG siap.';
  }catch(e){
    status.textContent='Export PNG gagal. Gunakan SVG.';
  }finally{
    if(url)URL.revokeObjectURL(url);
  }
});
</script>
</body>
</html>
